# Production virtual hosts. Certificate file names match win-acme --pemfilesname bot.aolukomorie56.ru.
Listen 443
<VirtualHost *:80>
    ServerName bot.aolukomorie56.ru
    DocumentRoot "C:/LukomorieAssistant/acme-webroot"

    ProxyRequests Off
    ProxyPass "/.well-known/acme-challenge/" "!"

    <Directory "C:/LukomorieAssistant/acme-webroot">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://bot.aolukomorie56.ru%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName bot.aolukomorie56.ru

    SSLEngine On
    SSLCertificateFile "C:/Apache24/conf/certs/bot.aolukomorie56.ru-chain.pem"
    SSLCertificateKeyFile "C:/Apache24/conf/certs/bot.aolukomorie56.ru-key.pem"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass "/" "http://127.0.0.1:8080/" connectiontimeout=5 timeout=60
    ProxyPassReverse "/" "http://127.0.0.1:8080/"
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</VirtualHost>
