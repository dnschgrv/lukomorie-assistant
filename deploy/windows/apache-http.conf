# Initial HTTP-only virtual host. Use it before requesting the TLS certificate.
<VirtualHost *:80>
    ServerName bot.aolukomorie56.ru
    DocumentRoot "C:/LukomorieAssistant/acme-webroot"

    ProxyRequests Off
    ProxyPass "/.well-known/acme-challenge/" "!"

    <Directory "C:/LukomorieAssistant/acme-webroot">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://bot.aolukomorie56.ru%{REQUEST_URI} [R=301,L]
</VirtualHost>
